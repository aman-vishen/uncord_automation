[SERVER]
# Local central production server. Do NOT point this application at Render.
URL = http://192.168.20.10:8765
API_KEY = change-this-key
STATION_ID = BOX-BUILD-01
TIMEOUT_SECONDS = 10

[BOX_BUILD]
# Production flow: 1 = Box Build occurs before MAC Write. In v13.7 it is stage 3 and MAC Write is stage 4.
# When enabled, any old REQUIRE_MAC_WRITE_PASS=1 value is ignored.
BOX_BUILD_BEFORE_MAC_WRITE = 1

# Legacy option only. Box Build is before MAC Write, so keep this OFF.
# Set to 1 only for a nonstandard line where Box Build happens after MAC Write.
REQUIRE_MAC_WRITE_PASS = 0

# The scanned product label must contain MAC + Serial Number + GPON Serial Number.
REQUIRE_ALL_LABEL_VALUES = 1

# Automatically clear the completed unit and prepare for the next label scan.
SUCCESS_CLEAR_DELAY_MS = 700
