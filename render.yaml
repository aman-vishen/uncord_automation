services:
  - type: web
    name: ete-production-mes
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./mes_dashboard/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ete-production-mes-db
          property: connectionString
      - key: INGEST_API_KEY
        sync: false
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: REFRESH_SECONDS
        value: "10"
      - key: MAX_BATCH_SIZE
        value: "500"
      - key: TARGET_UPH
        value: "0"

databases:
  - name: ete-production-mes-db
    plan: free
    region: singapore
