name: Package MAC Rewrite v13.72

on:
  push:
    branches: [ main ]
    paths:
      - "releases/v13_72_mac_rewrite_rework_gate/**"
      - ".github/workflows/package_mac_rewrite_v13_72.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python files
        run: |
          python -m py_compile releases/v13_72_mac_rewrite_rework_gate/mac_rewrite/app.py
          python -m py_compile releases/v13_72_mac_rewrite_rework_gate/mac_rewrite/firmware_updater.py
          python -m py_compile releases/v13_72_mac_rewrite_rework_gate/patch_server_v13_72.py

      - name: Test server patch on repository server copy
        run: |
          cp server/server.py /tmp/server_v13_72_test.py
          python releases/v13_72_mac_rewrite_rework_gate/patch_server_v13_72.py /tmp/server_v13_72_test.py
          python -m py_compile /tmp/server_v13_72_test.py
          grep -q "FINAL_VERIFICATION_ALREADY_PASSED" /tmp/server_v13_72_test.py
          grep -q "/api/rework/authorize" /tmp/server_v13_72_test.py

      - name: Build package folder
        run: |
          mkdir -p package/ETE_MAC_Rewrite_v13_72
          cp -R releases/v13_72_mac_rewrite_rework_gate/mac_rewrite package/ETE_MAC_Rewrite_v13_72/
          cp releases/v13_72_mac_rewrite_rework_gate/RUN_MAC_REWRITE.bat package/ETE_MAC_Rewrite_v13_72/
          cp releases/v13_72_mac_rewrite_rework_gate/PATCH_SERVER_ONCE.bat package/ETE_MAC_Rewrite_v13_72/
          cp releases/v13_72_mac_rewrite_rework_gate/patch_server_v13_72.py package/ETE_MAC_Rewrite_v13_72/
          cp releases/v13_72_mac_rewrite_rework_gate/requirements.txt package/ETE_MAC_Rewrite_v13_72/
          cp releases/v13_72_mac_rewrite_rework_gate/README.txt package/ETE_MAC_Rewrite_v13_72/

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETE_MAC_Rewrite_v13_72
          path: package/ETE_MAC_Rewrite_v13_72
          if-no-files-found: error
          retention-days: 30
