name: Publish v13.18 clean source to main

on:
  push:
    branches:
      - v13-18-firmware-last
    paths:
      - '.release/v13_18_payload_fresh/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch release payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v13-18-firmware-last
          rm -rf /tmp/v13_18_release
          mkdir -p /tmp/v13_18_release
          git archive origin/v13-18-firmware-last .release/v13_18_payload_fresh | tar -x -C /tmp/v13_18_release

      - name: Reconstruct v13.18 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh01.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh02.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh03.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh04.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh05.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh06.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh07a.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh07b.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh07c.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh08.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh09.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh10a.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh10b.b64 \
            /tmp/v13_18_release/.release/v13_18_payload_fresh/fresh10c.b64 \
            | base64 -d > /tmp/v13_18_text_payload.tar.gz
          echo "67aa18ea7262172355b3da2f6903ca2952f96eb70d63f127f70eaaf928829929  /tmp/v13_18_text_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v13_18_text_payload.tar.gz -C .

          # Binary assets already present in main are retained. Add the Box Build logo from the shared ETE logo.
          mkdir -p box_build/assets
          cp mac_writer/assets/ete_logo.png box_build/assets/ete_logo.png

          # Remove temporary publishing files and all runtime/generated data.
          rm -rf .release
          rm -f .github/workflows/v13_18_publish.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-shm' -o -name '*.db-wal' \) -delete
          rm -f mac_writer/pending_jobs.json

      - name: Commit and publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ETE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Release v13.18 firmware-last clean source"
          git push origin HEAD:main
