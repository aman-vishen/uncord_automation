# Paid production Blueprint. Rename this file to render.yaml before creating
# the production Blueprint, or select this path in Render.
services:
  - type: web
    name: ete-production-mes
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./mes_dashboard/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ete-production-mes-db
          property: connectionString
      - key: INGEST_API_KEY
        sync: false
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: REFRESH_SECONDS
        value: "10"
      - key: MAX_BATCH_SIZE
        value: "500"

databases:
  - name: ete-production-mes-db
    plan: basic-256mb
    region: singapore
    diskSizeGB: 15
