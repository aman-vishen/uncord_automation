# ============================================================
# ETE SOLUTIONS INDIA - UNCORD ROUTER FINAL QUALITY VERIFIER
# Product profile: AC1200
# Commands are populated from UNCORD_Router_Command_Template.xlsx.
# ============================================================

[PRODUCT]
MODEL = AC1200
COMMAND_SOURCE = UNCORD_Router_Command_Template.xlsx

[SERVER]
URL = http://192.168.20.10:8765
API_KEY = change-this-key
STATION_ID = LINE1-VERIFY1
TIMEOUT = 5

[SERIAL_SCAN]
ENABLED = 1
REQUIRED = 1
EXTRACT_REGEX = ^\s*([A-Za-z0-9._/-]{4,64})\s*$
GROUP = 1
CASE_SENSITIVE = 0
BLOCK_DUPLICATE_SCANS = 1
CAMERA_INDEX = 0
CAMERA_TIMEOUT = 30
CONFIRM_FRAMES = 2
AUTO_START_AFTER_SCAN = 0

[TELNET]
PORT = 23
USERNAME = admin
PASSWORD = admin
LOGIN_PROMPT = login:
PASSWORD_PROMPT = Password:
COMMAND_PROMPT = #
TIMEOUT = 10
COMMAND_DELAY = 0.30
PREFLIGHT_TIMEOUT = 1.5
EXIT_COMMAND = exit

[ROUTERS]
COUNT = 8

[ROUTER_1]
ENABLED = 1
NAME = Router 1
IP = 192.168.20.101

[ROUTER_2]
ENABLED = 1
NAME = Router 2
IP = 192.168.20.102

[ROUTER_3]
ENABLED = 1
NAME = Router 3
IP = 192.168.20.103

[ROUTER_4]
ENABLED = 1
NAME = Router 4
IP = 192.168.20.104

[ROUTER_5]
ENABLED = 1
NAME = Router 5
IP = 192.168.20.105

[ROUTER_6]
ENABLED = 1
NAME = Router 6
IP = 192.168.20.106

[ROUTER_7]
ENABLED = 1
NAME = Router 7
IP = 192.168.20.107

[ROUTER_8]
ENABLED = 1
NAME = Router 8
IP = 192.168.20.108

# ============================================================
# IDENTITY READBACK
# Workbook response format:
# Prolinecmd get OK. / Value=<...> / Done!
# ============================================================

[READ_MAC]
COMMAND_1 = prolinecmd macaddr get
REGEX = (?im)^\s*Value\s*=\s*<?([0-9A-Fa-f]{12})>?\s*$
GROUP = 1

[READ_SERIAL]
COMMAND_1 = prolinecmd hwsn get
REGEX = (?im)^\s*Value\s*=\s*<?([A-Za-z0-9._/-]+)>?\s*$
GROUP = 1

[READ_GPON_NUMBER]
COMMAND_1 = prolinecmd gponsn get
REGEX = (?im)^\s*Value\s*=\s*<?([A-Za-z0-9._/-]+)>?\s*$
GROUP = 1

[READ_PART_NUMBER]
# The supplied workbook has no part-number read command.
# Use the sheet/model name as the production part value until a real command is supplied.
STATIC_VALUE = AC1200
REGEX = (?i)(?:Part|PN|Part Number)\s*[:=]\s*([A-Z0-9._/-]+)
GROUP = 1

[VALIDATION]
SERIAL_VALID_REGEX = ^[A-Za-z0-9._/-]{4,64}$
GPON_VALID_REGEX = ^[A-Za-z0-9._/-]{4,64}$
PART_NUMBER_VALID_REGEX = ^[A-Za-z0-9._/-]{2,64}$
EXPECTED_PART_NUMBERS = AC1200
EXPECTED_PART_NUMBER_REGEX =

# ============================================================
# WI-FI CALIBRATION DATA
# Commands are preserved exactly from the workbook.
# The workbook does not define expected output or pass criteria, so blank
# PASS_REGEX/FAIL_REGEX means the application checks for a non-empty response.
# IMPORTANT: Workbook 5G rows use rai0 for e2p 999 but ra0 for 08/09; verify
# those two commands with firmware engineering before production release.
# ============================================================

[WIFI_CALIBRATION]
COMMAND_1 = iwpriv ra0 e2p 999
COMMAND_2 = iwpriv ra0 e2p 08
COMMAND_3 = iwpriv ra0 e2p 09
COMMAND_4 = iwpriv rai0 e2p 999
COMMAND_5 = iwpriv ra0 e2p 08
COMMAND_6 = iwpriv ra0 e2p 09
PASS_REGEX =
FAIL_REGEX =

[BOB_CALIBRATION]
COMMAND_1 = echo show_BoB_information > /proc/pon_phy/debug
# No response/pass criterion is supplied in the workbook. This currently checks
# only that the Telnet command returns output; add a readback command and regex
# when the firmware team supplies them.
PASS_REGEX =
FAIL_REGEX =

[FIRMWARE_VERSION]
COMMAND_1 = uci get system.@system[0].version
REGEX = (?i)\b(V1\.0\.1_[0-9]{6})\b
GROUP = 1
EXPECTED_VERSIONS =
EXPECTED_REGEX = ^V1\.0\.1_[0-9]{6}$

# ============================================================
# LED SEQUENCE: 1 = ON, 0 = OFF
# This profile sends every LED path listed for AC1200. Missing paths may print
# shell errors but the operator still makes the physical LED PASS/FAIL decision.
# ============================================================

[LED_TEST]
START_COMMAND_1 = echo 1 > /sys/class/leds/internet/brightness
START_COMMAND_2 = echo 1 > /sys/class/leds/power/brightness
START_COMMAND_3 = echo 1 > /sys/class/leds/wps/brightness
START_COMMAND_4 = echo 1 > /sys/class/leds/voip_hook/brightness
START_COMMAND_5 = echo 1 > /sys/class/leds/wlan/brightness
START_COMMAND_6 = echo 1 > /sys/class/leds/xponLos/brightness
START_COMMAND_7 = echo 1 > /sys/class/leds/xponStatus/brightness
STOP_COMMAND_1 = echo 0 > /sys/class/leds/internet/brightness
STOP_COMMAND_2 = echo 0 > /sys/class/leds/power/brightness
STOP_COMMAND_3 = echo 0 > /sys/class/leds/wps/brightness
STOP_COMMAND_4 = echo 0 > /sys/class/leds/voip_hook/brightness
STOP_COMMAND_5 = echo 0 > /sys/class/leds/wlan/brightness
STOP_COMMAND_6 = echo 0 > /sys/class/leds/xponLos/brightness
STOP_COMMAND_7 = echo 0 > /sys/class/leds/xponStatus/brightness
INSTRUCTION = Confirm every fitted LED turns on correctly, then press LED PASS. The application will turn the listed LEDs off.

# ============================================================
# BUTTON TESTS
# The workbook provides physical instructions and expected asynchronous logs,
# not a shell polling command. PASSIVE_MONITOR=1 keeps Telnet open and watches
# the session for the exact log patterns.
# ============================================================

[RESET_TEST]
PASSIVE_MONITOR = 1
PASS_REGEX = (?is)the button was BTN_0 and the action was pressed
TIMEOUT = 20
POLL_INTERVAL = 0.5
DISCONNECT_IS_PASS = 0
INSTRUCTION = Press and hold the RESET button until the expected log is detected.

[WPS_TEST]
PASSIVE_MONITOR = 1
PASS_REGEX = (?is)(?=.*the button was wps and the action was pressed)(?=.*the button was wps and the action was released)
TIMEOUT = 20
POLL_INTERVAL = 0.5
DISCONNECT_IS_PASS = 0
INSTRUCTION = Press and hold, then release the WPS button until both logs are detected.

# ============================================================
# FINAL USER MODE + POST-REBOOT CONFIRMATION
# ============================================================

[USER_MODE]
COMMAND_1 = prolinecmd factorymode set 0
COMMAND_2 = firstboot -y -r
PASS_REGEX =
ALLOW_DISCONNECT = 1
RECONNECT_DELAY = 35
VERIFY_TIMEOUT = 120
VERIFY_COMMAND_1 = prolinecmd factorymode get
VERIFY_PASS_REGEX = (?is)Prolinecmd get OK\..*?Value\s*=\s*0.*?Done!

# ============================================================
# ADDITIONAL WORKBOOK COMMANDS (currently not executed as verifier stages)
# ============================================================

[OPTICAL_POWER]
COMMAND_1 = /userfs/bin/ponmgr gpon get phyTransParams

[ENABLE_TELNET]
COMMAND_1 = prolinecmd telnetEnable set 1
EXPECTED_REGEX = (?is)Prolinecmd set OK\..*?Done!

[SET_WIFI_SSID]
ENABLED = 0
COMMAND_1 = prolinecmd ssid set "<SSID_NAME>"

[SET_WIFI_PASSWORD]
ENABLED = 0
COMMAND_1 = prolinecmd wpakey set "<PASSWORD>"
